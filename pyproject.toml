[project]
name = "claude-ppt"
version = "0.0.1"
description = "Convert YouTube summary text into HTML slide sets and editable PPTX files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
claude-ppt-render = "claude_ppt.render:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_ppt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
